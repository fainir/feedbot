name: Ingest cron

on:
  schedule:
    # Every 30 minutes — scans sources, classifies, inserts new articles.
    # Reduced from 15min to ease load on Railway (OOM/SSL/DNS recurrence).
    - cron: "*/30 * * * *"
    # Daily digest email at 08:00 UTC
    - cron: "0 8 * * *"
    # Daily prune at 04:00 UTC — drops old article_pool + feed_items rows
    # to keep the Supabase Disk I/O budget from drifting back into the red.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which endpoint to hit
        required: true
        default: scan-and-match
        type: choice
        options:
          - scan-and-match
          - refresh-feeds
          - digest
          - prune

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick endpoint from schedule or manual input
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "path=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "path=digest" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "path=prune" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "path=scan-and-match" >> "$GITHUB_OUTPUT"
            echo "extra=refresh-feeds" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight health check
        id: health
        # Cheap probe before the real cron call. If the app is unreachable
        # (DNS SERVFAIL, 5xx, cold-start in progress), skip THIS run with a
        # clean exit — we KNOW the app isn't ready, so this isn't a failure
        # we should page on. The next scheduled run will pick it up.
        # Real cron-endpoint failures (the app IS up but errored) still fail loudly.
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Health probe attempt $attempt..."
            status=$(curl --silent --show-error --max-time 30 \
              --write-out "%{http_code}" -o /tmp/health_out \
              "https://myfeed.space/api/health")
            rc=$?
            [ -f /tmp/health_out ] && { cat /tmp/health_out; echo; }
            if [ "$rc" -eq 0 ] && [ "$status" = "200" ]; then
              echo "Health OK"
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Health probe failed (rc=$rc, status=$status)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "App is unreachable after 3 health probes — skipping this run."
          echo "Will pick up on the next scheduled tick."
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Hit cron endpoint
        if: steps.health.outputs.healthy == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PATH_: ${{ steps.pick.outputs.path }}
          EXTRA_: ${{ steps.pick.outputs.extra }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set in repo settings — aborting." >&2
            exit 1
          fi
          hit_endpoint() {
            local path="$1"
            local url="https://myfeed.space/api/cron/$path"
            local attempt status rc
            for attempt in 1 2 3; do
              echo "GET $url (attempt $attempt)"
              set +e
              status=$(curl --silent --show-error --write-out "%{http_code}" -o /tmp/curl_out \
                --max-time 540 \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$url")
              rc=$?
              set -e
              [ -f /tmp/curl_out ] && { cat /tmp/curl_out; echo; }
              if [ "$rc" -eq 0 ] && [ "$status" -lt 400 ]; then
                return 0
              fi
              if [ "$rc" -ne 0 ]; then
                echo "curl failed with exit code $rc"
              else
                echo "Request failed with HTTP $status"
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Waiting 30s before retry..."
                sleep 30
              fi
            done
            echo "Giving up on $path after 3 attempts." >&2
            return 1
          }
          hit_endpoint "$PATH_" || exit 1
          if [ -n "$EXTRA_" ]; then
            hit_endpoint "$EXTRA_" || exit 1
          fi

name: Ingest cron

on:
  schedule:
    # Every 15 minutes — scans sources, classifies, inserts new articles
    - cron: "*/15 * * * *"
    # Daily digest email at 08:00 UTC
    - cron: "0 8 * * *"
    # Daily prune at 04:00 UTC — drops old article_pool + feed_items rows
    # to keep the Supabase Disk I/O budget from drifting back into the red.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which endpoint to hit
        required: true
        default: scan-and-match
        type: choice
        options:
          - scan-and-match
          - refresh-feeds
          - digest
          - prune

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick endpoint from schedule or manual input
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "path=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "path=digest" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "path=prune" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "path=scan-and-match" >> "$GITHUB_OUTPUT"
            echo "extra=refresh-feeds" >> "$GITHUB_OUTPUT"
          fi
      - name: Hit cron endpoint
        # Never fail the job — transient DNS / 5xx / Railway cold starts must
        # not page the maintainer. Failures are logged; the next scheduled run
        # picks up where this one left off.
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PATH_: ${{ steps.pick.outputs.path }}
          EXTRA_: ${{ steps.pick.outputs.extra }}
        run: |
          set +e
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set in repo settings — skipping run." >&2
            exit 0
          fi
          hit_endpoint() {
            local path="$1"
            local url="https://myfeed.space/api/cron/$path"
            local attempt status rc
            for attempt in 1 2 3; do
              echo "GET $url (attempt $attempt)"
              status=$(curl --silent --show-error --write-out "%{http_code}" -o /tmp/curl_out \
                --max-time 540 \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$url" 2>&1)
              rc=$?
              [ -f /tmp/curl_out ] && { cat /tmp/curl_out; echo; }
              if [ "$rc" -eq 0 ] && [ -n "$status" ] && [ "$status" -lt 400 ] 2>/dev/null; then
                echo "OK ($status)"
                return 0
              fi
              if [ "$rc" -ne 0 ]; then
                echo "curl failed (exit $rc): $status"
              else
                echo "Request failed with HTTP $status"
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Waiting 30s before retry..."
                sleep 30
              fi
            done
            echo "Giving up on $path after 3 attempts — will retry next scheduled run." >&2
            return 0
          }
          hit_endpoint "$PATH_" || true
          if [ -n "$EXTRA_" ]; then
            hit_endpoint "$EXTRA_" || true
          fi
          # Always succeed — failures already logged above.
          exit 0

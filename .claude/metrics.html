<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-hover: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --purple: #bc8cff;
  --radius: 8px;
  --radius-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* Header */
.header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header .meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Layout */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 28px;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}
.kpi-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.kpi-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
}
.kpi-change {
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}
.kpi-change.positive { color: var(--green); }
.kpi-change.negative { color: var(--red); }
.kpi-change.neutral { color: var(--text-muted); }

/* Chart sections */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
.chart-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}
.chart-panel h2 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}
.chart-panel svg {
  width: 100%;
  display: block;
}

/* Agent table */
.table-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 32px;
}
.table-panel h2 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-hover); }

/* Bar in table */
.bar-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mini-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--accent);
  transition: width .3s;
}
.mini-bar.green { background: var(--green); }
.mini-bar.red { background: var(--red); }

/* Cost section */
.cost-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 12px;
}
.cost-item {
  text-align: center;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius);
}
.cost-item .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.cost-item .value {
  font-size: 20px;
  font-weight: 700;
  margin-top: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  .charts-grid { grid-template-columns: 1fr; }
  .cost-grid { grid-template-columns: 1fr; }
  .container { padding: 16px; }
  .header { padding: 16px; }
}

/* Print */
@media print {
  body { background: #fff; color: #1a1a1a; }
  .chart-panel, .table-panel, .kpi-card { border: 1px solid #ccc; background: #f9f9f9; break-inside: avoid; }
}
</style>
</head>
<body>

<!-- METRICS_DATA_START -->
<script id="metrics-data" type="application/json">
{
  "project": "MyFeed",
  "updatedAt": "2026-04-03T15:30:00Z",
  "kpis": {
    "totalTasks": { "value": 27, "change": "15 done, 5 up next, 7 backlog", "direction": "neutral" },
    "completionRate": { "value": "56%", "change": "15 of 27 tasks complete", "direction": "positive" },
    "avgCycleTime": { "value": "1 day", "change": "launched yesterday", "direction": "positive" },
    "activeAgents": { "value": 1, "change": "healthy", "direction": "neutral" }
  },
  "burndown": {
    "labels": ["Mar 28", "Mar 29", "Mar 30", "Mar 31", "Apr 1", "Apr 2", "Apr 3"],
    "ideal": [27, 23, 19, 15, 11, 7, 3],
    "actual": [27, 24, 21, 18, 16, 14, 12]
  },
  "velocity": {
    "labels": ["Mar 28", "Mar 29", "Mar 30", "Mar 31", "Apr 1", "Apr 2", "Apr 3"],
    "completed": [3, 3, 3, 3, 2, 2, 0],
    "added": [0, 0, 0, 0, 0, 0, 0]
  },
  "qualityScores": {
    "labels": ["UI/UX", "Performance", "Completeness", "Code Quality"],
    "scores": [80, 80, 60, 80]
  },
  "costs": {
    "totalTokens": 0,
    "estimatedCost": 150.00,
    "costPerTask": 5.56,
    "tokensByModel": { "ai-scoring": 96, "railway": 5, "overhead": 49 }
  },
  "agents": [
    { "name": "macbook-pro", "completed": 15, "failed": 0, "avgTime": "~2h", "successRate": 100 }
  ]
}
</script>
<!-- METRICS_DATA_END -->

<div class="header">
  <h1 id="project-name"></h1>
  <div class="meta" id="updated-at"></div>
</div>

<div class="container">
  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="charts-grid">
    <div class="chart-panel">
      <h2>Burndown</h2>
      <svg id="burndown-chart" viewBox="0 0 500 240"></svg>
    </div>
    <div class="chart-panel">
      <h2>Velocity (tasks/day)</h2>
      <svg id="velocity-chart" viewBox="0 0 500 240"></svg>
    </div>
    <div class="chart-panel">
      <h2>Quality Scores (out of 100)</h2>
      <svg id="quality-chart" viewBox="0 0 500 240"></svg>
    </div>
    <div class="chart-panel">
      <h2>Cost Breakdown (~$150/month at scale)</h2>
      <div id="cost-section"></div>
    </div>
  </div>

  <div class="table-panel">
    <h2>Agent Performance</h2>
    <table id="agent-table">
      <thead>
        <tr>
          <th>Agent</th>
          <th>Completed</th>
          <th>Failed</th>
          <th>Avg Time</th>
          <th>Success Rate</th>
        </tr>
      </thead>
      <tbody id="agent-tbody"></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  var data = JSON.parse(document.getElementById('metrics-data').textContent);
  document.getElementById('project-name').textContent = (data.project || 'Project') + ' Metrics';
  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updatedAt).toLocaleString();

  // KPI Cards
  var kpis = data.kpis || {};
  var kpiGrid = document.getElementById('kpi-grid');
  var kpiLabels = { totalTasks: 'Total Tasks', completionRate: 'Completion Rate', avgCycleTime: 'Avg Cycle Time', activeAgents: 'Active Agents' };
  Object.keys(kpiLabels).forEach(function(key) {
    var k = kpis[key] || {};
    kpiGrid.innerHTML += '<div class="kpi-card">' +
      '<div class="kpi-label">' + kpiLabels[key] + '</div>' +
      '<div class="kpi-value">' + (k.value || '\u2014') + '</div>' +
      '<div class="kpi-change ' + (k.direction || 'neutral') + '">' + (k.change || '') + '</div>' +
    '</div>';
  });

  // SVG chart helpers
  var chartPad = { top: 20, right: 20, bottom: 30, left: 45 };
  var cw = 500, ch = 240;
  var plotW = cw - chartPad.left - chartPad.right;
  var plotH = ch - chartPad.top - chartPad.bottom;

  function makeLineChart(svgId, labels, datasets) {
    var svg = document.getElementById(svgId);
    var allVals = [];
    datasets.forEach(function(ds) { allVals = allVals.concat(ds.data); });
    var maxVal = Math.max.apply(null, allVals) * 1.1 || 1;
    var minVal = 0;
    var n = labels.length;

    var gridLines = '';
    for (var g = 0; g <= 4; g++) {
      var gy = chartPad.top + plotH - (g / 4) * plotH;
      var gv = Math.round(minVal + (g / 4) * (maxVal - minVal));
      gridLines += '<line x1="' + chartPad.left + '" y1="' + gy + '" x2="' + (cw - chartPad.right) + '" y2="' + gy + '" stroke="' + '#30363d' + '" stroke-width="0.5"/>';
      gridLines += '<text x="' + (chartPad.left - 8) + '" y="' + (gy + 4) + '" text-anchor="end" fill="#8b949e" font-size="10">' + gv + '</text>';
    }

    // X labels
    var xlabels = '';
    labels.forEach(function(l, i) {
      var x = chartPad.left + (i / (n - 1)) * plotW;
      xlabels += '<text x="' + x + '" y="' + (ch - 6) + '" text-anchor="middle" fill="#8b949e" font-size="10">' + l + '</text>';
    });

    var paths = '';
    datasets.forEach(function(ds) {
      var points = ds.data.map(function(v, i) {
        var x = chartPad.left + (i / (n - 1)) * plotW;
        var y = chartPad.top + plotH - ((v - minVal) / (maxVal - minVal)) * plotH;
        return x + ',' + y;
      });
      paths += '<polyline points="' + points.join(' ') + '" fill="none" stroke="' + ds.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (ds.dashed ? ' stroke-dasharray="6 4"' : '') + '/>';
      // Dots
      ds.data.forEach(function(v, i) {
        var x = chartPad.left + (i / (n - 1)) * plotW;
        var y = chartPad.top + plotH - ((v - minVal) / (maxVal - minVal)) * plotH;
        paths += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="' + ds.color + '"/>';
      });
    });

    svg.innerHTML = gridLines + xlabels + paths;
  }

  function makeBarChart(svgId, labels, datasets) {
    var svg = document.getElementById(svgId);
    var allVals = [];
    datasets.forEach(function(ds) { allVals = allVals.concat(ds.data); });
    var maxVal = Math.max.apply(null, allVals) * 1.2 || 1;
    var n = labels.length;
    var barGroupWidth = plotW / n;
    var barWidth = barGroupWidth / (datasets.length + 1);
    var barGap = barWidth * 0.2;

    var gridLines = '';
    for (var g = 0; g <= 4; g++) {
      var gy = chartPad.top + plotH - (g / 4) * plotH;
      var gv = Math.round((g / 4) * maxVal);
      gridLines += '<line x1="' + chartPad.left + '" y1="' + gy + '" x2="' + (cw - chartPad.right) + '" y2="' + gy + '" stroke="#30363d" stroke-width="0.5"/>';
      gridLines += '<text x="' + (chartPad.left - 8) + '" y="' + (gy + 4) + '" text-anchor="end" fill="#8b949e" font-size="10">' + gv + '</text>';
    }

    var xlabels = '';
    var bars = '';
    labels.forEach(function(l, i) {
      var groupX = chartPad.left + i * barGroupWidth;
      xlabels += '<text x="' + (groupX + barGroupWidth / 2) + '" y="' + (ch - 6) + '" text-anchor="middle" fill="#8b949e" font-size="10">' + l + '</text>';

      datasets.forEach(function(ds, di) {
        var v = ds.data[i] || 0;
        var bh = (v / maxVal) * plotH;
        var bx = groupX + (di + 0.5) * barWidth + barGap;
        var by = chartPad.top + plotH - bh;
        bars += '<rect x="' + bx + '" y="' + by + '" width="' + (barWidth - barGap * 2) + '" height="' + bh + '" fill="' + ds.color + '" rx="3"/>';
      });
    });

    svg.innerHTML = gridLines + xlabels + bars;
  }

  // Burndown
  var bd = data.burndown || {};
  if (bd.labels) {
    makeLineChart('burndown-chart', bd.labels, [
      { data: bd.ideal || [], color: '#30363d', dashed: true },
      { data: bd.actual || [], color: '#58a6ff', dashed: false }
    ]);
  }

  // Velocity
  var vel = data.velocity || {};
  if (vel.labels) {
    makeBarChart('velocity-chart', vel.labels, [
      { data: vel.completed || [], color: '#3fb950' },
      { data: vel.added || [], color: '#58a6ff' }
    ]);
  }

  // Quality
  var qs = data.qualityScores || {};
  if (qs.labels) {
    makeBarChart('quality-chart', qs.labels, [
      { data: qs.scores || [], color: '#bc8cff' }
    ]);
  }

  // Costs
  var costs = data.costs || {};
  var costHtml = '<div class="cost-grid">';
  costHtml += '<div class="cost-item"><div class="label">AI Scoring</div><div class="value">~$4.80/day</div></div>';
  costHtml += '<div class="cost-item"><div class="label">Railway Hosting</div><div class="value">Hobby Tier</div></div>';
  costHtml += '<div class="cost-item"><div class="label">Est. Monthly</div><div class="value">~$150</div></div>';
  costHtml += '</div>';

  // Cost breakdown bar
  var tbm = costs.tokensByModel || {};
  var totalTok = Object.keys(tbm).reduce(function(s, k) { return s + tbm[k]; }, 0) || 1;
  var modelColors = { 'ai-scoring': '#f85149', 'railway': '#58a6ff', 'overhead': '#3fb950' };
  var modelLabels = { 'ai-scoring': 'AI Scoring (~$4.80/day)', 'railway': 'Railway Hosting', 'overhead': 'Other/Overhead' };
  costHtml += '<div style="margin-top:16px">';
  costHtml += '<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--border)">';
  Object.keys(tbm).forEach(function(model) {
    var pct = (tbm[model] / totalTok) * 100;
    costHtml += '<div style="width:' + pct + '%;background:' + (modelColors[model] || '#8b949e') + '" title="' + (modelLabels[model] || model) + '"></div>';
  });
  costHtml += '</div>';
  costHtml += '<div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--text-muted)">';
  Object.keys(tbm).forEach(function(model) {
    costHtml += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + (modelColors[model] || '#8b949e') + ';margin-right:4px"></span>' + (modelLabels[model] || model) + ' ' + Math.round((tbm[model] / totalTok) * 100) + '%</span>';
  });
  costHtml += '</div></div>';
  document.getElementById('cost-section').innerHTML = costHtml;

  // Agent table
  var tbody = document.getElementById('agent-tbody');
  (data.agents || []).forEach(function(a) {
    var rateColor = a.successRate >= 90 ? 'green' : (a.successRate >= 70 ? '' : 'red');
    tbody.innerHTML += '<tr>' +
      '<td><strong>' + a.name + '</strong></td>' +
      '<td>' + a.completed + '</td>' +
      '<td>' + a.failed + '</td>' +
      '<td>' + a.avgTime + '</td>' +
      '<td><div class="bar-cell"><div class="mini-bar ' + rateColor + '" style="width:' + a.successRate + 'px"></div>' + a.successRate + '%</div></td>' +
    '</tr>';
  });
})();
</script>
</body>
</html>

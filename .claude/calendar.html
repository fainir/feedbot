<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-hover: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --purple: #bc8cff;
  --pink: #f778ba;
  --today-bg: rgba(88, 166, 255, 0.08);
  --today-border: var(--accent);
  --radius: 8px;
  --radius-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* Header */
.header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header .meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Nav */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
}
.cal-nav-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.nav-buttons {
  display: flex;
  gap: 6px;
}
.nav-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.nav-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}
.nav-btn.today-btn {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Legend */
.legend {
  padding: 10px 28px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

/* Calendar grid */
.cal-container {
  padding: 16px 28px 40px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.cal-dow {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  text-align: center;
  padding: 10px 4px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.cal-cell {
  min-height: 110px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 6px 8px;
  background: var(--bg);
  cursor: default;
  transition: background .15s;
  position: relative;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:hover { background: var(--surface-hover); }
.cal-cell.other-month {
  opacity: 0.35;
}
.cal-cell.today {
  background: var(--today-bg);
  box-shadow: inset 0 0 0 2px var(--today-border);
}
.cal-day {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-day .today-badge {
  font-size: 9px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  padding: 1px 5px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

/* Events on calendar */
.cal-event {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 3px;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
  transition: opacity .15s;
}
.cal-event:hover { opacity: 0.8; }
.cal-event.deadline { background: rgba(248, 81, 73, 0.2); color: var(--red); border-left: 3px solid var(--red); }
.cal-event.milestone { background: rgba(188, 140, 255, 0.2); color: var(--purple); border-left: 3px solid var(--purple); }
.cal-event.task { background: rgba(88, 166, 255, 0.15); color: var(--accent); border-left: 3px solid var(--accent); }
.cal-event.release { background: rgba(63, 185, 80, 0.2); color: var(--green); border-left: 3px solid var(--green); }
.cal-event.meeting { background: rgba(247, 120, 186, 0.2); color: var(--pink); border-left: 3px solid var(--pink); }
.cal-event.review { background: rgba(210, 153, 34, 0.2); color: var(--orange); border-left: 3px solid var(--orange); }

/* Event detail panel */
.event-detail {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 100;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  min-width: 320px;
  max-width: 440px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.event-detail.visible { display: block; }
.event-detail h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}
.event-detail .detail-row {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.event-detail .detail-row strong {
  color: var(--text);
}
.event-detail .close-btn {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.event-detail .close-btn:hover { color: var(--text); }
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}
.overlay.visible { display: block; }

/* Responsive */
@media (max-width: 768px) {
  .cal-cell { min-height: 80px; padding: 4px; }
  .cal-event { font-size: 10px; padding: 1px 4px; }
  .cal-container { padding: 10px 12px 30px; }
  .header, .cal-nav, .legend { padding-left: 16px; padding-right: 16px; }
}

/* Print */
@media print {
  body { background: #fff; color: #1a1a1a; }
  .cal-cell { background: #fff; border-color: #ccc; }
  .cal-cell.today { background: #f0f6ff; box-shadow: inset 0 0 0 2px #0366d6; }
  .nav-buttons { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <h1 id="project-name"></h1>
  <div class="meta" id="updated-at"></div>
</div>

<div class="cal-nav">
  <div class="nav-buttons">
    <button type="button" class="nav-btn" id="prev-month" aria-label="Previous month">&larr; Prev</button>
    <button type="button" class="nav-btn today-btn" id="go-today">Today</button>
    <button type="button" class="nav-btn" id="next-month" aria-label="Next month">Next &rarr;</button>
  </div>
  <div class="cal-nav-title" id="month-title"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Deadline</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Milestone</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Task</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Release</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pink)"></div>Meeting</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Review</div>
</div>

<div class="cal-container">
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="event-detail" id="event-detail">
  <button type="button" class="close-btn" id="close-detail" aria-label="Close">&times;</button>
  <h3 id="detail-title"></h3>
  <div class="detail-row"><strong>Date:</strong> <span id="detail-date"></span></div>
  <div class="detail-row"><strong>Type:</strong> <span id="detail-type"></span></div>
  <div class="detail-row" id="detail-desc-row"><strong>Details:</strong> <span id="detail-desc"></span></div>
</div>

<script>
(function() {
  var data = JSON.parse(document.getElementById('calendar-data').textContent);
  var events = data.events || [];

  document.getElementById('project-name').textContent = (data.project || 'Project') + ' Calendar';
  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updatedAt).toLocaleString();

  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();

  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Index events by date string
  var eventsByDate = {};
  events.forEach(function(e) {
    if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
    eventsByDate[e.date].push(e);
  });

  function dateKey(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function renderMonth() {
    document.getElementById('month-title').textContent = months[viewMonth] + ' ' + viewYear;
    var grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    // Day of week headers
    dows.forEach(function(d) {
      grid.innerHTML += '<div class="cal-dow">' + d + '</div>';
    });

    var firstDay = new Date(viewYear, viewMonth, 1);
    var startDow = firstDay.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

    // Previous month fill
    for (var p = startDow - 1; p >= 0; p--) {
      var pd = prevMonthDays - p;
      var pm = viewMonth === 0 ? 11 : viewMonth - 1;
      var py = viewMonth === 0 ? viewYear - 1 : viewYear;
      grid.innerHTML += buildCell(py, pm, pd, true);
    }

    // Current month
    for (var d = 1; d <= daysInMonth; d++) {
      grid.innerHTML += buildCell(viewYear, viewMonth, d, false);
    }

    // Next month fill
    var totalCells = startDow + daysInMonth;
    var remaining = (7 - (totalCells % 7)) % 7;
    for (var n = 1; n <= remaining; n++) {
      var nm = viewMonth === 11 ? 0 : viewMonth + 1;
      var ny = viewMonth === 11 ? viewYear + 1 : viewYear;
      grid.innerHTML += buildCell(ny, nm, n, true);
    }
  }

  function buildCell(y, m, d, isOther) {
    var key = dateKey(y, m, d);
    var isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());
    var cls = 'cal-cell';
    if (isOther) cls += ' other-month';
    if (isToday) cls += ' today';

    var html = '<div class="' + cls + '">';
    html += '<div class="cal-day">' + d;
    if (isToday) html += ' <span class="today-badge">today</span>';
    html += '</div>';

    var dayEvents = eventsByDate[key] || [];
    dayEvents.forEach(function(e) {
      html += '<div class="cal-event ' + e.type + '" data-id="' + e.id + '">' + e.title + '</div>';
    });

    html += '</div>';
    return html;
  }

  // Navigation
  document.getElementById('prev-month').addEventListener('click', function() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMonth();
  });
  document.getElementById('next-month').addEventListener('click', function() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMonth();
  });
  document.getElementById('go-today').addEventListener('click', function() {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    renderMonth();
  });

  // Event detail
  var evtMap = {};
  events.forEach(function(e) { evtMap[e.id] = e; });

  var detail = document.getElementById('event-detail');
  var overlay = document.getElementById('overlay');

  document.addEventListener('click', function(e) {
    var el = e.target.closest('.cal-event');
    if (el) {
      var evt = evtMap[el.dataset.id];
      if (!evt) return;
      document.getElementById('detail-title').textContent = evt.title;
      document.getElementById('detail-date').textContent = evt.date;
      document.getElementById('detail-type').textContent = evt.type;
      var descRow = document.getElementById('detail-desc-row');
      if (evt.description) {
        document.getElementById('detail-desc').textContent = evt.description;
        descRow.style.display = '';
      } else {
        descRow.style.display = 'none';
      }
      detail.classList.add('visible');
      overlay.classList.add('visible');
    }
  });

  function closeDetail() {
    detail.classList.remove('visible');
    overlay.classList.remove('visible');
  }
  document.getElementById('close-detail').addEventListener('click', closeDetail);
  overlay.addEventListener('click', closeDetail);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDetail();
  });

  renderMonth();
})();
</script>
</body>
</html>

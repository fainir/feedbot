    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-hover: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --p0: #f85149;
        --p1: #d29922;
        --p2: #e3b341;
        --p3: #3fb950;
        --done: #3fb950;
        --radius: 8px;
        --radius-lg: 12px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }

      /* Header */
      .header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .header-left h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .header-left .meta {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* Progress bar */
      .progress-wrap {
        flex: 1 1 300px;
        max-width: 480px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .progress-bar {
        flex: 1;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--done));
        border-radius: 4px;
        transition: width 0.4s ease;
      }
      .progress-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
      }

      /* Filters */
      .filters {
        padding: 12px 28px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
      }
      .filter-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .filter-group label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .filter-group select {
        font-family: inherit;
        font-size: 13px;
        padding: 5px 10px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        outline: none;
      }
      .filter-group select:focus {
        border-color: var(--accent);
      }

      /* Board */
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        min-height: calc(100vh - 140px);
      }
      .column {
        border-right: 1px solid var(--border);
        padding: 16px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .column:last-child {
        border-right: none;
      }
      .column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border);
      }
      .column-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
      }
      .column-count {
        font-size: 12px;
        font-weight: 600;
        background: var(--border);
        color: var(--text-muted);
        padding: 2px 8px;
        border-radius: 10px;
      }
      .column[data-status="done"] .column-header {
        border-bottom-color: var(--done);
      }
      .column[data-status="in_progress"] .column-header {
        border-bottom-color: var(--accent);
      }
      .column[data-status="in_review"] .column-header {
        border-bottom-color: #bc8cff;
      }
      .column[data-status="backlog"] .column-header {
        border-bottom-color: var(--text-muted);
      }

      /* Cards */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        flex: 1;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 14px;
        cursor: default;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .card:hover {
        border-color: var(--accent);
        background: var(--surface-hover);
      }
      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        word-break: break-word;
      }
      .priority-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .sprint-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(63, 185, 80, 0.15);
        color: var(--done);
        letter-spacing: 0.3px;
      }
      .priority-badge.p0 {
        background: var(--p0);
        color: #fff;
      }
      .priority-badge.p1 {
        background: var(--p1);
        color: #1a1a1a;
      }
      .priority-badge.p2 {
        background: var(--p2);
        color: #1a1a1a;
      }
      .priority-badge.p3 {
        background: var(--p3);
        color: #1a1a1a;
      }

      .card-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .card-assignee {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .card-assignee::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
      }
      .card-date {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: auto;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .tag {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(88, 166, 255, 0.12);
        color: var(--accent);
      }

      /* Empty state */
      .empty {
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
        padding: 24px 8px;
        opacity: 0.6;
      }

      /* Responsive */
      @media (max-width: 960px) {
        .board {
          grid-template-columns: repeat(2, 1fr);
        }
        .column {
          border-bottom: 1px solid var(--border);
        }
      }
      @media (max-width: 560px) {
        .board {
          grid-template-columns: 1fr;
        }
        .header {
          padding: 16px;
        }
        .filters {
          padding: 10px 16px;
        }
        .column {
          padding: 12px;
        }
      }

      /* Print */
      @media print {
        body {
          background: #fff;
          color: #1a1a1a;
        }
        .card {
          border: 1px solid #ccc;
          background: #f9f9f9;
          break-inside: avoid;
        }
        .column {
          border-right: 1px solid #ccc;
        }
        .filters {
          display: none;
        }
        .tag {
          background: #e0e0e0;
          color: #333;
        }
      }
    </style>

        var sprints = data.sprints || [];
        var sprintMap = {};
        sprints.forEach(function (s) {
          sprintMap[s.id] = s;
        });

        document.getElementById("project-name").textContent =
          data.project || "Project Board";
        document.getElementById("updated-at").textContent =
          "Updated " + new Date(data.updatedAt).toLocaleString();

        // Build filter options
        var priorities = [],
          assignees = [],
          allTags = [],
          sprintIds = [];
        tasks.forEach(function (t) {
          if (t.priority && priorities.indexOf(t.priority) === -1)
            priorities.push(t.priority);
          if (t.assignee && assignees.indexOf(t.assignee) === -1)
            assignees.push(t.assignee);
          if (t.sprint && sprintIds.indexOf(t.sprint) === -1)
            sprintIds.push(t.sprint);
          (t.skillTags || []).forEach(function (tag) {
            if (allTags.indexOf(tag) === -1) allTags.push(tag);
          });
        });
        priorities.sort();
        assignees.sort();
        allTags.sort();

        var pSel = document.getElementById("filter-priority");
        var aSel = document.getElementById("filter-assignee");
        var tSel = document.getElementById("filter-tag");
        var sSel = document.getElementById("filter-sprint");
        priorities.forEach(function (p) {
          pSel.innerHTML += '<option value="' + p + '">' + p + "</option>";
        });
        assignees.forEach(function (a) {
          aSel.innerHTML += '<option value="' + a + '">' + a + "</option>";
        });
        allTags.forEach(function (t) {
          tSel.innerHTML += '<option value="' + t + '">' + t + "</option>";
        });
        sprintIds.forEach(function (id) {
          var name = sprintMap[id] ? sprintMap[id].name : id;
          sSel.innerHTML += '<option value="' + id + '">' + name + "</option>";
        });

        function priorityClass(p) {
          return (p || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        }

        function renderCard(t) {
          var tags = (t.skillTags || [])
            .map(function (tag) {
              return '<span class="tag">' + tag + "</span>";
            })
            .join("");
          var sprintName =
            t.sprint && sprintMap[t.sprint] ? sprintMap[t.sprint].name : "";
          var sprintBadge = sprintName
            ? '<span class="sprint-badge">' + sprintName + "</span>"
            : "";
          return (
            '<div class="card" data-priority="' +
            (t.priority || "") +
            '" data-assignee="' +
            (t.assignee || "") +
            '" data-tags="' +
            (t.skillTags || []).join(",") +
            '">' +
            '<div class="card-top">' +
            '<span class="card-title">' +
            (t.title || "Untitled") +
            "</span>" +
            (t.priority
              ? '<span class="priority-badge ' +
                priorityClass(t.priority) +
                '">' +
                t.priority +
                "</span>"
              : "") +
            "</div>" +
            (tags || sprintBadge
              ? '<div class="tags">' + sprintBadge + tags + "</div>"
              : "") +
            '<div class="card-meta">' +
            (t.assignee
              ? '<span class="card-assignee">' + t.assignee + "</span>"
              : "") +
            (t.createdAt
              ? '<span class="card-date">' + t.createdAt + "</span>"
              : "") +
            "</div>" +
            "</div>"
          );
        }

        function render() {
          var fp = pSel.value;
          var fa = aSel.value;
          var ft = tSel.value;
          var fs = sSel.value;

          var columns = {
            backlog: [],
            in_progress: [],
            in_review: [],
            done: [],
          };
          var doneCount = 0;
          var totalCount = 0;

          tasks.forEach(function (t) {
            if (fp && t.priority !== fp) return;
            if (fa && t.assignee !== fa) return;
            if (ft && (t.skillTags || []).indexOf(ft) === -1) return;
            if (fs && t.sprint !== fs) return;

            var status = (t.status || "backlog")
              .toLowerCase()
              .replace(/[\s-]+/g, "_");
            if (!columns[status]) status = "backlog";
            columns[status].push(t);
            totalCount++;
            if (status === "done") doneCount++;
          });

          Object.keys(columns).forEach(function (key) {
            var el = document.getElementById("col-" + key);
            if (columns[key].length === 0) {
              el.innerHTML = '<div class="empty">No tasks</div>';
            } else {
              el.innerHTML = columns[key].map(renderCard).join("");
            }
            var counter = document.querySelector('[data-count="' + key + '"]');
            if (counter) counter.textContent = columns[key].length;
          });

          var pct =
            totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
          document.getElementById("progress-fill").style.width = pct + "%";
          document.getElementById("progress-label").textContent =
            doneCount + "/" + totalCount + " done (" + pct + "%)";
        }

        pSel.addEventListener("change", render);
        aSel.addEventListener("change", render);
        tSel.addEventListener("change", render);
        sSel.addEventListener("change", render);

        render();
      })();
    </script>
  </body>
</html>
